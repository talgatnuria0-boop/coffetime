<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spelling Worksheet</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="sheet">
        <h1>Spelling Worksheet</h1>
        <div class="score">Correct: <span id="score">0</span> / <span id="total">0</span></div>
        <div class="grid" id="grid"></div>
        <div class="win" id="win">Great job! 🎉<br>
        <button class="again" id="again">Play again</button>
    </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
